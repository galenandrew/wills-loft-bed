<svg viewBox="0 0 622 747" role="img" aria-label="Room floor plan, bed wall at the top, window wall to the left" style="max-width:808px;margin:0 auto"><style>svg{--ink:#23231f;--ink2:#5f5d56;--ink3:#8a877e;--bg:#fbfaf7;--card:#fff;--line:#e0ddd4;
