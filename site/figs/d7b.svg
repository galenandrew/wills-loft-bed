" x="456.0" y="41.9" text-anchor="end">beam end — bypasses the opening</text><g class="dim "><line x1="113.0" y1="115.8" x2="113.0" y2="492.0" marker-start="url(#da)" marker-end="url(#db)"/><line x1="108.0" y1="115.8" x2="118.0" y2="115.8"/><line x1="108.0" y1="492.0" x2="118.0" y2="492.0"/><text x="107.0" y="303.9" text-anchor="end" dominant-baseline="middle">53¾ to top plate</text></g><g class="dim "><line x1="274.0" y1="206.8" x2="274.0" y2="492.0" marker-start="url(#da)" marker-end="url(#db)"/><line x1="269.0" y1="206.8" x2="279.0" y2="206.8"/><line x1="269.0" y1="492.0" x2="279.0" y2="492.0"/><text x="268.0" y="349.4" text-anchor="end" dominant-baseline="middle">40¾ finished head</text></g><g class="dim "><line x1="501.5" y1="51.0" x2="501.5" y2="492.0" marker-start="url(#da)" marker-end="url(#db)"/><line x1="496.5" y1="51.0" x2="506.5" y2="51.0"/><line x1="496.5" y1="492.0" x2="506.5" y2="492.0"/><text x="507.5" y="271.5" text-anchor="start" dominant-baseline="middle">63 beam top</text></g><g class="dim"><line x1="155.0" y1="502.5" x2="463.0" y2="502.5" marker-start="url(#da)" marker-end="url(#db)"/><line x1="155.0" y1="497.5" x2="155.0" y2="507.5"/><line x1="463.0" y1="497.5" x2="463.0" y2="507.5"/><text x="309.0" y="515.5" text-anchor="middle">44</text></g><g class="dim"><line x1="144.5" y1="128.0" x2="473.5" y2="128.0" marker-start="url(#da)" marker-end="url(#db)"/><line x1="144.5" y1="123.0" x2="144.5" y2="133.0"/><line x1="473.5" y1="123.0" x2="473.5" y2="133.0"/><text x="309.0" y="123.0" text-anchor="middle">47 header</text></g></svg>