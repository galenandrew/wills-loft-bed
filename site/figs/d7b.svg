<svg viewBox="0 0 568 536" role="img" aria-label="Half-wall section at x = 104.5, bed wall on the left" style="max-width:738px;margin:0 auto"><style>svg{--ink:#23231f;--ink2:#5f5d56;--ink3:#8a877e;--bg:#fbfaf7;--card:#fff;--line:#e0ddd4;
