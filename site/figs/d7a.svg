<svg viewBox="0 0 637 164" role="img" aria-label="Half-wall plan detail, horizontal section at 30 inches, rotated so the bed wall is on the left and the stair side up" style="max-width:828px;margin:0 auto"><style>svg{--ink:#23231f;--ink2:#5f5d56;--ink3:#8a877e;--bg:#fbfaf7;--card:#fff;--line:#e0ddd4;
