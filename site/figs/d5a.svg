.hatchline{stroke:var(--lumline);stroke-width:.6}.badline{stroke:var(--red);stroke-width:1}.bad{fill:url(#bad);stroke:var(--red);stroke-width:1}
.ink{stroke:var(--ink);stroke-width:1}.dash{stroke:var(--ink2);stroke-width:1;stroke-dasharray:6 4}.ghostl{stroke:var(--ink2);stroke-width:.9;stroke-dasharray:3 3;fill:none}.floor{stroke:var(--wall);stroke-width:3}.redline{stroke:var(--red);stroke-width:1.6;stroke-dasharray:7 4}
.soffit{fill:none;stroke:var(--fin);stroke-width:3}polyline.hanger{fill:none}
.dim line{stroke:var(--pencil);stroke-width:.9}.dim text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;fill:var(--pencil)}marker path{fill:var(--pencil)}</style><defs><marker id="da" markerWidth="7" markerHeight="7" refX="1" refY="3.5" orient="auto"><path d="M7,0 L0,3.5 L7,7 z"/></marker><marker id="db" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" class="hatchline"/></pattern><pattern id="bad" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="5" class="badline"/></pattern></defs><rect class="wall" x="90.0" y="30.0" width="14.0" height="448.0" /><line class="floor" x1="90.0" y1="478.0" x2="468.0" y2="478.0"/><rect class="ghost" x="130.2" y="192.8" width="297.5" height="285.2" /><polyline class="soffit" points="130.2,192.8 233.5,192.8 427.8,371.6"/><ellipse class="light" cx="170.5" cy="192.8" rx="21.0" ry="4.9"/><rect class="sheet" x="104.0" y="101.8" width="21.0" height="376.2" /><rect class="sheet" x="125.0" y="101.8" width="308.0" height="85.8" /><rect class="sheet" x="433.0" y="101.8" width="21.0" height="376.2" /><rect class="sheet" x="454.0" y="107.0" width="5.2" height="371.0" /><rect class="dashfill" x="114.5" y="122.8" width="329.0" height="64.8" /><rect class="dashfill" x="104.0" y="122.8" width="10.5" height="344.8" /><rect class="dashfill" x="443.5" y="122.8" width="10.5" height="344.8" /><rect class="dashfill" x="114.5" y="187.5" width="10.5" height="280.0" /><rect class="dashfill" x="433.0" y="187.5" width="10.5" height="280.0" /><rect class="fin" x="125.0" y="187.5" width="308.0" height="5.2" /><rect class="fin" x="125.0" y="192.8" width="5.2" height="285.2" /><rect class="fin" x="427.8" y="192.8" width="5.2" height="285.2" /><rect class="dashfill" x="114.5" y="135.3" widt