# dimensions.yaml — the single source of truth for the loft bed.
#
# Rev U (2026-09-04). Supersedes the Rev T encoding (archive/dimensions-T.yaml).
# `python3 verify.py` recomputes every derived quantity and checks every
# declared connection for real three-axis overlap; `python3 build.py` renders
# site/ from this file. Both run automatically from the edit hook. Fix the data, re-run.
#
# COORDINATES (inches, decimal — verify.py prints nearest 1/16 alongside)
#   x  from the WINDOW wall finished face, toward the right wall (0 … 131)
#   y  from the BED wall finished face, toward the closet wall    (0 … 186)
#   z  above finished floor                                        (0 … 96)
# Every extent is the FRAMING extent of that member (actual lumber size),
# never a finished dimension. Finished faces are separate members (wrap,
# sheathing, ply).
#
# Rev W decisions:
#   · tread/riser joinery corrected. The exposed face of each plumb notch is its
#     DOWNHILL side, so the riser board goes IN FRONT of the cut (y1 → y1+3/4), its
#     bottom edge on the stringer's horizontal cut for the tread below. The tread
#     below starts where that riser ends and butts its face — simple butt joint,
#     riser behind the tread, nothing notched. Rev V's note said the opposite and
#     the drawing drew a third thing (riser recessed INTO the stringer); a CAD
#     kernel check found it (audits/V-kernel-spike.md).
#   · consequence: every board is full 24" width, tread boards stay 9 1/8, and the
#     nosing-to-nosing going is exactly 9.000 at all five steps. Framing lines are
#     unchanged; the FINISHED nosings land 7/8 downhill of them, so the stair's
#     finished projection is 72 7/8 (framing 72) and the landing 27 7/8 (framing 27).
#   · lnd_ply runs to y 27.875 — 3/4 past the framing line for the riser board, then
#     the same 1/8 nose the treads get. Rev V drew that nose as a literal in d4.
#   · the stringers are notched 1 1/2 x 3 1/2 over the kicker at their floor seat.
#
# Rev V decisions:
#   · treads 3/4" plywood, no nosing — 1/8" overhang, tape-sealed edge, painted; stringers dropped 3/4"
#   · landing plywood colored as the finished surface (matches the tread/riser finish)
#
# Rev U decisions (see audits/U-decisions.md):
#   · stringers extend 9" under the landing; plumb cut 41.74→48.75 = a 2x8
#   · landing box all 2x8 on that line; rim on HUC28s; joists run with the stringers
#   · nook opening jambed in 3/4 poplar; finished ceiling 40.75, flush through the opening
#   · CLOSED at Rev AG, not parked: the beam's window end is the 10 1/2 tongue over a
#     3 1/2 notch, bearing 2.62 sq in on side_ledger + 2.62 on deck_joist_tail (3" of
#     backing, not 1"); and slat 0 has a real seat because the beam runs to x 0 now.
#     cad-out/loft.txt carries both areas.
# Anything marked ASSUMED is not in the drawings and must be confirmed.

rev: BC
units: inches
room:
  x: 131
  y: 186
  ceiling: 96
  window:
    wall: window
    y:
    - 95
    - 150
  door:
    wall: right
    y:
    - 150
    - 182
    width: 32
    to_corner: 4
    note: 'Rev AB: 4, was 3.5. ASSUMED — not measured. Every placed thing along the right
      wall agreed on 185.5 from the bed wall to the closet corner while room.y said 186, so
      the survey missed by 1/2 and the chain could not close. 4 is the value that closes it
      (186 - the door''s far edge at 182) and it disturbs nothing else, but the 1/2 could
      equally be in room.y or in any item along the wall. FIELD: confirm with a tape, door
      casing to the corner and the room''s overall depth. Nothing in the build depends on
      this — the deepest built member is the stringer foot at y 72 and everything is
      dimensioned outward from the bed wall — so the whole 1/2 lands in the stair-to-dresser
      gap either way.'
mattress:
  size:
  - 38
  - 75
  thickness: 8
  note: 'Rev AI: 8, the mattress alone - the 2 topper is dropped, to buy back the sitting
    headroom it cost (28 -> 30). Rev AG had measured the pair at 10 and sized the beam and
    the boxed ledge off a 68 mattress top; the top is 66 now, so the beam''s finished top at
    68.5 stands 2 1/2 proud instead of 1/2. Was ASSUMED 6 before it was measured at all.'
lumber:
  2x2:
  - 1.5
  - 1.5
  2x4:
  - 1.5
  - 3.5
  2x6:
  - 1.5
  - 5.5
  2x8:
  - 1.5
  - 7.25
  2x10:
  - 1.5
  - 9.25
  2x12:
  - 1.5
  - 11.25
  # NOMINAL 2x14, like every other key here; 1.75 x 14 is the actual, the same way
  # 2x4 is actually 1.5 x 3.5. LVL is sold at the 1-3/4 ply thickness, so 2x is its
  # nominal. Cut lists and member extents use the ACTUAL, always.
  lvl-2x14:
  - 1.75
  - 14
  header-2x10-sandwich:
  - 3.5
  - 9.25
  ply-3/4:
  - 0.75
  - null
  ply-1/2:
  - 0.5
  - null
  # Rev BA: paint-grade SOLID stock at the 2x4 section - 1 1/2 x 3 1/2 actual, the same
  # section as an SPF 2x4, but knot-free and stable enough to paint. Poplar 8/4 S4S is the
  # first choice; clear/select pine at the same section is an acceptable substitute. It
  # exists for screen_top_plate, a STRUCTURAL member that happens to be fully in view.
  # `poplar-3/4` is gone - Rev AZ moved its last two members (hw_end_cap and its foot) to
  # 1/2 ply, and a stock key nothing uses invites someone to think 3/4 poplar is still in
  # the build.
  poplar-2x4:
  - 1.5
  - 3.5
  # Rev BB: the slats' answer to the same question as screen_top_plate, in the same species
  # - same actual section as a framing 2x2, 1 1/2 x 1 1/2. Source 1 1/2 x 1 1/2 S4S poplar
  # or clear/select pine directly if it can be found; otherwise buy the 1 1/2 x 3 1/2 stock
  # (the same board as screen_top_plate) and rip/sand it down.
  poplar-2x2:
  - 1.5
  - 1.5
stair:
  # Rev Y: the riser is an INPUT now, not 58/7. Six equal risers carry the stair to
  # the landing; the seventh (landing → loft deck) is set by the framing stack above
  # the nook header and need not match — see `top_riser`.
  riser: 8.25
  top_riser: 8.5
  risers: 7
  run: 9
  treads: 5
  landing_depth: 27
  width: 24
  stringer_stock: 2x12
  stringer_count: 3
  stringer_pitch: 11.625
  tread_thickness: 0.75
  tread_board_width: 9.125
  throat_min: 3.5
  top_run: 9
  landing_deck_thickness: 0.75
nook:
  opening_y:
  - 3.5
  - 46.5
  header_bottom: 41.5
  flat_ceiling_to_y: 18.26
  soffit_panel_thickness: 0.5
  light: 6-inch recessed — fixture depth not stated; chase is ~4 inches
  note: 'Rev X: header_bottom is now the landing-ledger bottom (lnd_ledger_bedwall.z[0]),
    so the soffit runs flush from under the landing out through the opening. Rev U''s poplar
    jambs are gone; the nook is one ply-wrapped tube from x 102.75 to the right wall (x 131).
    Rev AD: the tube starts 3/4 back from the half-wall''s outer face, not on it — the face is
    its own panel and laps the tube''s end. Rev AZ: the `wrap:` KEY IS GONE. It was one number
    doing two jobs — it set the finished flat-ceiling face (header_bottom − wrap) and, via
    drawings JAMB_Y, the finished opening — and the two are no longer one number: the ceiling
    panel is 1/2, the bed-wall lining is still 3/4 and the short-wall lining is 1/2. The
    ceiling face now comes off soffit_panel_thickness, which is what that arithmetic always
    meant, and JAMB_Y is read straight off the two lining members'' own faces. Both were
    identical at 3/4 and would have quietly produced a wrong opening here.'
loft_lighting:
  desk:
    fixture: 4-inch slim canless LED
    count: 2
    x: 12
    y:
    - 12.5
    - 37.5
  walkway:
    fixture: 6-inch slim canless LED
    count: 1
    x: 63
    y: 25
  note: 'NEW. Three lights recessed into loft_ceiling, same shallow-cavity problem as the
    nook light: loft_light_chase is only the joist depth (3.5, ceiling top to deck ply).
    Slim canless fixtures, which can intersect a joist (unlike a can housing), so
    positions are true geometric centres, not joist-bay centres. The two 4in over the
    desk share ONE x, 12 - the centre of the desk''s own depth (x 0-24) - and run along y
    instead, parallel to the window wall and the desk''s long axis: y 12.5 and 37.5, the
    quarter points of loft_ceiling''s 0-50 run. The 6in walkway light sits at the true
    midpoint, x 63, between the desk''s inner edge (x 24) and the half-wall''s loft face
    (x 102, clear_below_deck_x) - which happens to fall on deck_joist[5] (61.5-63); fine
    for a slim canless fixture, but worth a field check that the specific fixture chosen
    can actually straddle a joist before cutting the hole. ASSUMED — confirm fixture
    choice, exact position and switch location with the user before wiring; see
    open-items.'
electrical:
  note: 'Rev BC. The devices the room needs, placed on the members they mount to.
    loft_lighting (above) stays where it is because Drawing 1 of the Rev U set reads
    it; everything else lives here, and the drawings read both through one adapter
    (verify.electrical_devices) so no position is written down twice. `face` is the
    direction the device LOOKS; `box` is [width, height, depth] with depth going
    into the wall behind that face, and `lets_into` names every member the box is
    cut into. verify.py checks each device sits on its host, that a `centred` one
    really is centred, and that its box hits nothing it has not declared.'
  devices:
  - id: nk_light
    label: nook light
    kind: light
    circuit: nook
    fixture: 6-inch canless LED wafer
    host: nk_soffit_flat
    face: -z
    at:
    - 116.875
    - 11.25
    - 41.0
    centred: true
    box:
    - 6.5
    - 6.5
    - 1.0
    lets_into: []
    note: 'CONFIRMED by the builder (2026-09-08): the centre of the flat nook ceiling.
      The chase above the panel is nook_light_chase 3 3/4, from the panel top at 41 1/2
      to the landing joists at 45 1/4, so the wafer (~5/8) and its driver both sit
      clear of lnd_joist[0], whose x 114 3/4-116 1/4 otherwise runs straight over
      this point. Canless, not a can: nothing 4 inches deep fits here. Power must be
      run before the soffit panel goes up.'
  - id: ledge_outlet_window
    label: outlet
    kind: outlet
    circuit: ledge_outlets
    fixture: flush duplex receptacle in the lid
    host: ledge_lid
    face: +z
    at:
    - 8.0
    - 4.0
    - 69.0
    box:
    - 2.0
    - 3.0
    - 2.5
    lets_into: []
    note: 'Window end. Centred across the lid''s 8 width, so the box hangs into the
      ledge well clear of ledge_cleat (y 0-1 1/2) and ledge_cleat_rail (y 5 3/4-7 1/4),
      and clear of every ledge_strut in x. Faces up because there is nowhere else:
      the front rail''s face is behind the mattress below 66 and only 2 1/4 tall above it.'
  - id: ledge_outlet_stair
    label: outlet
    kind: outlet
    circuit: ledge_outlets
    fixture: flush duplex receptacle in the lid
    host: ledge_lid
    face: +z
    at:
    - 99.0
    - 4.0
    - 69.0
    box:
    - 2.0
    - 3.0
    - 2.5
    lets_into: []
    note: Stair end. Same detail as the window end.
  - id: sw_half_wall
    label: 2 switches
    kind: switch
    circuit: null
    switches:
    - nook
    - under_loft
    fixture: single-gang shallow box, two-circuit stacked rocker
    host: hw_sheath_loft_head
    face: -x
    at:
    - 102.25
    - 44.0
    - 36.0
    box:
    - 2.0
    - 3.0
    - 1.5
    lets_into: []
    note: 'TWO SWITCHES, ONE BOX, in the cavity — no framing is cut. At reach height
      the half wall is a portal frame, so the first reading of it was that the only
      solid face was the 4-wide board over the far jamb pack, which would have meant
      letting the box into the trimmer, the flitch and the king. That was wrong: the
      nook opening''s head RAKES, following the stringers down from 41 at y 18 1/4 to
      15 1/2 at y 46, and hw_sheath_loft_head is the panel above that line. At z 39 1/2
      the face is therefore continuous board from about y 20 all the way to the wall''s
      end, and behind it — above the rake nailer, below the header — is open cavity.
      The box sits at y 44: 2 wide, so y 43-45, with 1 1/2 clear of hw_trimmer_b at
      46 1/2 and the nailer''s 1 1/2 band 18-20 1/4, nowhere near it. Shallow single-gang
      old-work box clamped to the 1/2 face; a scrap 2x4 backing block behind it is the
      builder''s option, and has to go in before the face is sheathed either way.
      A 2-gang plate is 4 5/8 wide and the two switches are still a stacked rocker in
      one gang, which is what suits a single-gang box. 36 AFF, so the top of the box is
      37 1/2 and the header bottom at 41 1/2 is 4 clear above it — room for the cable to
      come in and be clamped, which 39 1/2 did not really leave. The cavity behind runs
      from the rake nailer at about 20 up to the header, so the height is a choice, not
      a constraint: 36 is low for an adult and a standard child-accessible height.'
screen:
  slat_count: 23
  slat_size: 1.5
  extent_x:
  - 0
  - 107
  slat_bottom: 68.25
  slat_top: 94.5
  max_clear: 3.5
members:
- id: rear_ledger
  stock: 2x4
  x:
  - 1.5
  - 106.25
  y:
  - 0
  - 1.5
  z:
  - 53.75
  - 57.25
  role: structural
  note: 'Rev T says 107 long and draws it 0-107, but the side ledger occupies x 0-1.5 and the
    half-wall''s stair face - hw_sheath_stair, which still covers 106.25-107 at this height -
    takes the other end. Cut length is therefore 104.75. CUT-LIST CORRECTION.

    Rev AO: a 2x4 at deck level, not a 2x6 standing 2 proud of it. Top is now the joist top
    (57.25), matching side_ledger, so deck_ply runs over it to the bed wall instead of
    butting its face - see deck_ply. This also removes the need for ledger_blocking, which
    existed only to give the ply edge a bearing shelf between joists while the ledger stood
    taller than the deck; with the ledger and joists now the same depth that shelf is
    continuous along the whole run.'
- id: side_ledger
  stock: 2x4
  x:
  - 0
  - 1.5
  y:
  - 0
  - 50
  z:
  - 53.75
  - 57.25
  role: structural
  note: 'Rev AG: a 2x4 at DECK level, not a 2x10 standing to the beam top. Its top is the
    joist top (57.25), so deck_ply runs over it to the window wall, the boxed ledge needs no
    notch, and nothing of the ledger shows above the deck. It stays 50 out (Rev Z) so it
    reaches under the beam''s full 1 3/4 width. The beam no longer butts its end face: the
    beam is NOTCHED over it and BEARS on its top, together with deck_joist[0] sistered to
    its inboard face - 3 (x) x 1 3/4 (y) = 5.25 sq in, about 115 psi against 425 allowable.
    FIELD, now load-bearing: the reaction lands 1.5-3 off the wall face and the overturning
    couple works over 3.5 of ledger depth instead of 9.25, so there must be a stud (or
    blocking added) within 6 of y 50, and the deck ply must be glued and screwed to the
    ledger top - that diaphragm is what stops a shallow ledger rolling.'
- id: deck_joist
  stock: 2x4
  x:
  - 1.5
  - 3
  y:
  - 1.5
  - 48.25
  z:
  - 53.75
  - 57.25
  role: structural
  repeat:
    count: 9
    axis: x
    pitch: 12
  note: 'Rev AG: 48.25 out, not 47 - the beam is 1 3/4 thick now and its outer face had to
    stay on 50, so the joists grew 1 1/4 to reach it. Span 46 3/4; deflection under 50 psf
    is 0.035, L/1350.'
- id: deck_joist_tail
  stock: 2x4
  part_of: deck_joist[0]
  x:
  - 1.5
  - 3
  y:
  - 48.25
  - 50
  z:
  - 53.75
  - 57.25
  role: structural
  note: 'Rev AG: NOT a separate piece - the last 1 3/4 of deck_joist[0], which runs 48 1/2
    to y 50 while the other eight stop at the beam face. Sistered to side_ledger over its
    whole length, it is what widens the beam''s seat from the ledger''s 1 1/2 to 3. Cut list:
    deck_joist[0] is one 48 1/2 2x4, the rest are 46 3/4.'
- id: deck_rim
  stock: 2x4
  x:
  - 104.75
  - 106.25
  y:
  - 1.5
  - 48.25
  z:
  - 53.75
  - 57.25
  role: structural
- id: deck_blocking
  stock: 2x4
  x:
  - 3
  - 13.5
  y:
  - 46.75
  - 48.25
  z:
  - 53.75
  - 57.25
  repeat:
    count: 8
    axis: x
    pitch: 12
  role: structural
  note: 'Rev AU: NEW. On edge between the joist ends at the beam''s face, filling all eight
    10 1/2 gaps (x 3-13 1/2, then every 12). The joists HANG off the beam on LUS24s, so
    without these the deck ply''s front edge lands at the LVL with nothing under it and
    nothing fastening it - the deck is the anti-roll diaphragm that stands in for posts, and
    it was glued and screwed to both ledgers and connected to the beam at zero points. These
    give the edge a continuous nailer into the LVL and close the diaphragm. Full joist depth
    (3 1/2) so a screw down through the ply catches 1 1/2 of solid edge, and 1 1/2 thick in y
    so it reaches back from the beam face into the bay. One 8 ft board covers all nine
    blocks. NOW OR NEVER: they go in before the deck ply.'
- id: deck_blocking_end
  stock: 2x4
  x:
  - 99
  - 104.75
  y:
  - 46.75
  - 48.25
  z:
  - 53.75
  - 57.25
  role: structural
  note: 'Rev AU: the ninth block. The last bay is not 10 1/2 - it runs from joist 8 (x 97 1/2
    to 99) to deck_rim at 104 3/4, so it is 5 3/4 and cannot ride the repeat. It is the bay
    over the half wall, where the beam is notched down onto hw_top_plate_2, so it is the last
    one to leave open. x 0 to 1 1/2 needs nothing: side_ledger runs the full y 0 to 50 and
    already backs the ply edge there.'
- id: deck_seam_blocking
  stock: 2x4
  x:
  - 3
  - 13.5
  y:
  - 22.25
  - 25.75
  z:
  - 55.75
  - 57.25
  repeat:
    count: 5
    axis: x
    pitch: 12
  role: structural
  note: 'Rev AX: FIVE blocks. The deck''s cross-joist seam stops at x 62 1/4, joist 5''s centre,
    where the layout changes to one full-depth 44 x 48 1/4 panel over the landing end - moved
    one joist further in than Rev AW''s 74 1/4 so the seam sits 14 3/4 inside the mattress edge
    at x 77 instead of 2 3/4. 62 1/4 is as far as it can go: the next joist in would need a 56
    wide panel, and 48 1/4 already has to run along the sheet''s 96, so 48 is the hard limit on
    its width. The blocked run is x 3 to 61 1/2; everything beyond is either the joist the seam
    lands on or the unseamed panel. Rev AV: FLAT (3 1/2 in y, 1 1/2 deep) under the deck
    ply''s seam at y 24,
    which gives 1 3/4 of bearing to each panel edge - the beam-face blocking is on edge
    because it backs one edge and wants depth for screws; this backs two and wants width.
    The seam exists to save a sheet: the deck is 48 1/4 in y, over a sheet''s 48 width, so
    without a seam each piece takes its own sheet. Exact piece sizes and sheet counts live in
    tools/materials.py PANEL_SPLITS, not here - this note used to quote a superseded count.
    The seam runs ACROSS the joists, not along one - it cannot land on a joist centre, which
    is why it needs blocking; it is caught where it crosses each joist and unsupported over
    the 10 1/2 between. y 24 puts it under the mattress (y 8 3/4 to 46 3/4), so it is never
    seen. x 0 to 1 1/2 needs none: side_ledger runs the full y 0 to 50 and backs it there.'
- id: deck_ply
  stock: ply-3/4
  x:
  - 0
  - 106.25
  y:
  - 0
  - 48.25
  z:
  - 57.25
  - 58
  role: sheet
  note: 'Rev AG: 106 1/4 x 46 3/4, was 104 3/4 x 45 1/2. It runs over the side ledger to the
    window wall now that the ledger is at deck level, and out to the beam''s new face at
    48.25. Glue and screw it to the ledger top at 6 o.c. - see side_ledger.

    Rev AO: now 48.25 x 48.25, flush to the bed wall - rear_ledger dropped to deck level
    (see rear_ledger) so the ply runs over its top too, the same way it already ran over
    side_ledger. This is what let ledger_blocking go: the ply''s wall-side edge now bears on
    the ledger continuously instead of on blocking pieces between joists.'
- id: beam
  stock: lvl-2x14
  x:
  - 3
  - 106.25
  y:
  - 48.25
  - 50
  z:
  - 53.75
  - 67.75
  role: structural
  note: 'Rev AG: a SINGLE 1 3/4 x 14 LVL, not a doubled 2x10. Depth is set by the mattress,
    not by load - top at 67.75 framing, 68.5 with the cap, half an inch proud of a 10
    mattress, so the beam is the bed rail. Bending is nowhere near it: worst case about
    21,000 in-lb against S = 57.2 in3 = 367 psi, and midspan deflection 0.015.
    Its outer face stays on 50 - beam_wrap_face, the slats, the screen plate and the
    half-wall''s 50-deep top plate all key off it - so the 1 1/4 it lost in width was given
    to the joists, not taken off the platform. At the half-wall end 1 1/2 of its 1 3/4 lands
    directly over hw_king_b (y 48.5 to 50), a straight post to the floor. This row is the
    body; beam_tongue is what survives the notch at the window end. Cut list: ONE LVL
    106 1/4 long, notched 3 (x) x 3 1/2 (z) out of the bottom left corner.'
- id: beam_tongue
  stock: lvl-2x14
  part_of: beam
  x:
  - 0
  - 3
  y:
  - 48.25
  - 50
  z:
  - 57.25
  - 67.75
  role: structural
  note: 'Rev AG: NOT a separate piece - the 10 1/2 of beam left above the notch, bearing on
    side_ledger and deck_joist_tail at 57.25 and running to the window wall. The notch is
    3 1/2 deep on a 14 beam: exactly the d/4 the code allows for a sawn end notch, and the
    NDS notch-shear formula gives about 1,960 lb against a reaction near 600. LVL makers
    formally prohibit bottom notches - a condition of their published capacities, which assume
    an intact tension edge, not a strength finding about this beam: 14 is set by the mattress
    top, so the section is roughly 7x over-strength in bending (370 psi vs 2600) and the notch
    check has 3x margin. Rev AT: the reinforcement is beam_wrap_face, NOT a separate cheek.
    Rev AG had prescribed a 3/4 ply cheek on the INBOARD face running 24 past the shoulder,
    which cannot be built there - deck_ply fills y to 48.25 at z 57.25-58 straight across the
    corner, and deck_joist[1] and [2] run out to 48.25 within that 24. The outboard face is
    clear and already carries 3/4 ply from z 53 to the beam top over the full length, and it
    lands on exactly the right members: above 57.25 it screws into the tongue, below it into
    the y-50 end faces of side_ledger and deck_joist_tail, the two members the tongue bears
    on. That is a better splice than an inboard cheek, in the same plane as any split the
    corner could start, and it costs a fastener schedule rather than a part. loft_ceiling is
    the SECOND restraint and it was nearly missed: it is screwed to the bottom edge of the very
    piece a split would separate (the beam''s bottom 3 1/2 beyond x 3, whose underside is the
    z 53.75 line) and to side_ledger and deck_joist_tail on the other side of x 3, so it ties
    that piece to members that cannot move, in the direction it would drop. Secondary to the
    wrap - withdrawal from a 1 3/4 laminated edge rather than shear in the plane of the split -
    but real, and between the two the notch is covered from both faces it can move relative to. A metal strap was
    considered and is not needed: it would do the same job in the same plane as screws that
