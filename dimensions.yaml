# dimensions.yaml — the single source of truth for the loft bed.
#
# Rev U (2026-09-04). Supersedes the Rev T encoding (archive/dimensions-T.yaml).
# `python3 verify.py` recomputes every derived quantity and checks every
# declared connection for real three-axis overlap; `python3 build.py` renders
# site/ from this file. Both run automatically from the edit hook. Fix the data, re-run.
#
# COORDINATES (inches, decimal — verify.py prints nearest 1/16 alongside)
#   x  from the WINDOW wall finished face, toward the right wall (0 … 131)
#   y  from the BED wall finished face, toward the closet wall    (0 … 186)
#   z  above finished floor                                        (0 … 96)
# Every extent is the FRAMING extent of that member (actual lumber size),
# never a finished dimension. Finished faces are separate members (wrap,
# sheathing, ply).
#
# Rev W decisions:
#   · tread/riser joinery corrected. The exposed face of each plumb notch is its
#     DOWNHILL side, so the riser board goes IN FRONT of the cut (y1 → y1+3/4), its
#     bottom edge on the stringer's horizontal cut for the tread below. The tread
#     below starts where that riser ends and butts its face — simple butt joint,
#     riser behind the tread, nothing notched. Rev V's note said the opposite and
#     the drawing drew a third thing (riser recessed INTO the stringer); a CAD
#     kernel check found it (audits/V-kernel-spike.md).
#   · consequence: every board is full 24" width, tread boards stay 9 1/8, and the
#     nosing-to-nosing going is exactly 9.000 at all five steps. Framing lines are
#     unchanged; the FINISHED nosings land 7/8 downhill of them, so the stair's
#     finished projection is 72 7/8 (framing 72) and the landing 27 7/8 (framing 27).
#   · lnd_ply runs to y 27.875 — 3/4 past the framing line for the riser board, then
#     the same 1/8 nose the treads get. Rev V drew that nose as a literal in d4.
#   · the stringers are notched 1 1/2 x 3 1/2 over the kicker at their floor seat.
#
# Rev V decisions:
#   · treads 3/4" plywood, no nosing — 1/8" overhang, tape-sealed edge, painted; stringers dropped 3/4"
#   · landing plywood colored as the finished surface (matches the tread/riser finish)
#
# Rev U decisions (see audits/U-decisions.md):
#   · stringers extend 9" under the landing; plumb cut 41.71→48.96 = a 2x8
#   · landing box all 2x8 on that line; rim on HUC28s; joists run with the stringers
#   · nook opening jambed in 3/4 poplar; finished ceiling 40.75, flush through the opening
#   · OPEN: beam left end on the side ledger (1" of 3" backed) and slat 0 — parked
# Anything marked ASSUMED is not in the drawings and must be confirmed.

