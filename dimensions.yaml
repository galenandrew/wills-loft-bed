  flat_ceiling_to_y: 18.26
  soffit_panel_thickness: 0.75
  light: 6-inch recessed — fixture depth not stated; chase is ~4 inches
  wrap: 0.75
  note: 'Rev X: header_bottom is now the landing-ledger bottom (lnd_ledger_bedwall.z[0]),
    so the soffit runs flush from under the landing out through the opening. `wrap` is the
    3/4 ply lining thickness — Rev U''s poplar jambs are gone; the nook is one ply-wrapped
    tube from x 102.75 to the right wall (x 131). Rev AD: the tube starts 3/4 back from the
