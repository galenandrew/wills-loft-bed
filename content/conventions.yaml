# The "Conventions" block on the index page. HTML with {placeholders} from drawings.model.VALS.
items:
- "<b>Every drawing is generated from <code>dimensions.yaml</code>.</b> Nothing here was placed by hand. If a drawing looks wrong, the data is wrong — fix the yaml, run <code>python3 verify.py</code>, then <code>python3 build.py</code>."
- "<b>Orientation.</b> Plans: bed wall at the top, window wall to the left. x–z views look toward the bed wall (window wall left). y–z views keep the <b>bed wall on the left</b> — sections cut at an x position are drawn mirrored where needed so that stays true."
- "<b>Hatched</b> = cut by the view. <b>Pale</b> = beyond the cut. <b>Dashed</b> = hidden. <b>Blue</b> = hardware. <b>Red</b> = a limit or an open finding."
- "<b>Framing vs finished.</b> Member extents are framing (actual lumber). Platform 50¾ finished / 50 framed. Half-wall 5 finished where it shows / 3½ of studs — and 4¼ where the stair runs against it. Deck 107 / 106¼ rim. Nook {nook_rough_w} × {nook_rough_h} rough / {nook_fin_w} × {nook_fin_h} finished. Cut lists use the framing numbers."
schedule_note: "<b>Framing vs finished.</b> The platform is 50¾ finished but 50 of framing — the last ¾ is the beam wrap. The half-wall is 5 finished where it shows and 3½ of studs; below the stair skirt its stair side is unsheathed, so it is 4¼ there. The deck is 107 to the finished wall face but its structural rim stops at 106¼. The nook is {nook_rough_w} × {nook_rough_h} rough and {nook_fin_w} × {nook_fin_h} finished. Cut lists must use the framing numbers; layout marks use the finished ones."
