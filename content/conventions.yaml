# The "Conventions" block on the index page. HTML with {placeholders} from drawings.model.VALS.
items:
- "<b>Every drawing is generated from <code>dimensions.yaml</code>.</b> Nothing here was placed by hand. If a drawing looks wrong, the data is wrong — fix the yaml, run <code>python3 verify.py</code>, then <code>python3 build.py</code>."
- "<b>Orientation.</b> Plans: bed wall at the top, window wall to the left. x–z views look toward the bed wall (window wall left). y–z views keep the <b>bed wall on the left</b> — sections cut at an x position are drawn mirrored where needed so that stays true."
- "<b>Hatched</b> = cut by the view. <b>Pale</b> = beyond the cut. <b>Dashed</b> = hidden. <b>Blue</b> = hardware. <b>Red</b> = a limit or an open finding."
- "<b>Framing vs finished.</b> Member extents are framing (actual lumber). Platform {m:beam_wrap_face.y1} finished / {m:beam.y1} framed. Half-wall {hw_fin_w} finished where it shows / {m:hw_king_a.size.x} of studs — and {hw_below_skirt} where the stair runs against it. Deck {m:beam_wrap_face.size.x} / {m:deck_rim.x1} rim. Nook {nook_rough_w} × {nook_rough_h} rough / {nook_fin_w} × {nook_fin_h} finished. Cut lists use the framing numbers."
schedule_note: "<b>Framing vs finished.</b> The platform is {m:beam_wrap_face.y1} finished but {m:beam.y1} of framing — the last {m:beam_wrap_face.size.y} is the beam wrap. The half-wall is {hw_fin_w} finished where it shows and {m:hw_king_a.size.x} of studs; below the stair skirt its stair side is unsheathed, so it is {hw_below_skirt} there. The deck is {m:beam_wrap_face.size.x} to the finished wall face but its structural rim stops at {m:deck_rim.x1}. The nook is {nook_rough_w} × {nook_rough_h} rough and {nook_fin_w} × {nook_fin_h} finished. Cut lists must use the framing numbers; layout marks use the finished ones."
