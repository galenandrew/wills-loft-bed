# Open items (site/open-items.html). tag: PARKED · FIELD · SPECIFY · SEQUENCE · VERIFY · LOCKED. text is HTML.
items:
- tag: FIELD
  text: "<b>Studs</b> in the bed wall, window wall and right wall — every ledger and stringer C depend on them. <b>Ceiling joist</b> nearest {m:screen_top_plate.y1} out. <b>Mattress</b> thickness — MEASURED 2026-09-06, 8 mattress + 2 topper = 10; sitting headroom is 28, not 32. <b>Room depth</b> — the chain now closes on 186 only because the door's <b>4 to the corner is assumed, not measured</b> (it was 3½, which left ½ unplaced). Confirm both: door casing to the closet-wall corner, and the room's overall depth. Nothing built depends on it — the ½ lands in the stair-to-dresser gap either way. <b>Floor joists</b> under the half-wall plate and the kicker."
- tag: SPECIFY
  text: "<b>Grades</b> — framing species/grade, the ply grades — <b>ONE pool per thickness</b>, at the builder's direction. Rev AZ moved about 93 sq ft of painted face from ¾ to ½, so the buy is now <b>4 sheets of ¾ paint-grade + 5 of ½ paint-grade</b> where it was 9 of ¾ + 1 of ½ — one sheet fewer overall, and five of them a thinner, cheaper, lighter sheet. Both pools are paint-grade: the deck moved into the ¾ pool at Rev AV (it is the finished walking surface), and the two structural jamb flitches plus the header's middle ply share the ½ pool rather than being the only reason to buy a board. Paint-grade is the better grade of the two, so nothing is under-specified by the mixing. <b>Buying the deck as rated sheathing instead would break the ¾ nest</b>, which assumes a single ¾ pool — reopen that deliberately or not at all. <b>Framing species/grade and the SLAT stock are still TBD</b> pending price and availability. <b>Rev BA sharpens the slat question:</b> <code>screen_top_plate</code> is now paint-grade solid stock ({m:screen_top_plate.size.y} × {m:screen_top_plate.size.z} poplar 8/4 S4S or clear/select pine) because it is structural and fully in view — and the {slat_count} slats are the same assembly, the same paint, and still the generic 2×2 key. <b>Decide the slats in the same species as the plate</b>, or the screen is two woods under one colour. · <b>kicker anchorage — the weakest chain in the model.</b> The stair's whole horizontal thrust runs stringers → notch hooked over the kicker → kicker → floor, and <b>both of those last two interfaces are unfastened</b>: the three <code>stringer → kicker</code> rows are bearing with no fastener at all, and until Rev AY <code>kicker → floor</code> was not even a row, so verify printed no line for it and it appeared in no schedule. It is declared and UNSPECIFIED now. Specify the floor anchorage, and consider toe-screwing the stringers to the kicker so the hook is not the only thing resisting thrust. Depends on locating the floor joists under it. · bottom-plate anchorage (still two boards, y 0→3½ and 46½→50, but each now runs the full 28¼ from the half wall through the nook)."
- tag: SEQUENCE
  text: "Nook power into the half-wall before sheathing; switch on the half-wall face, desk side. <b>Loft ceiling lights (loft_lighting, new) need their wiring run before loft_ceiling goes up</b> — the {m:loft_ceiling.size.z} ply screws straight to the joist bottoms with no chase left to fish through afterward. Position and switch location are ASSUMED and not yet confirmed. <b>Both loft-ceiling seams run along joist centres</b>, so every ceiling seam is backed, and both clear all three downlights — the cut layout in <code>materials/</code> carries the positions. An earlier scheme put a seam across the joists and it would have run straight through the 6″ walkway light. The fixture positions are still ASSUMED: <b>confirm all three before the ceiling is cut</b> — it is cut once. <b>The nook lining goes in before the nook face</b> — the face laps the ends of all three lining sheets, so a face panel fitted first has to come off again. <b>The stair-side skirt goes on last</b> (Rev AE): it lands on top of the landing box and the stringers, so it cannot be fitted until they are, and the treads and risers butt it. <b>Both bottom plates run through the half wall into the nook</b> — set them out and fix them as one board each, before the jamb packs. Stringer B's screws go in before the landing deck. <b>Both families of deck blocking go in before the deck ply</b> and are unreachable after it — now-or-never, and they are fixed differently. <code>deck_blocking</code> (on edge, at the beam face) is screwed from the beam's <b>OUTBOARD face at y 50</b>, so it also has to precede <code>beam_wrap_face</code> closing that face. <code>deck_seam_blocking</code> (flat, under the y-24 ply seam) is <b>toe-screwed into the joists at both ends</b> — there is no face to drive it from. Same trip as the wrap's own structural fixing over x 0–27. Risers go on before the treads — each tread butts the face of the riser behind it. <b>Shelf blocking in the nook's bed wall</b> (Rev BA): <code>nk_wrap_bedwall</code> stays {m:nk_wrap_bedwall.size.y} ply specifically because it is the nook's TALL wall ({m:nk_wrap_bedwall.z0}–{m:nk_wrap_bedwall.z1}) and the one shelves would go on — {m:nk_wrap_bedwall.size.y} takes a screw anywhere on the sheet, {m:nk_wrap_shortwall.size.y} would not. If the shelves might be heavy or high, <b>blocking between the <code>nk_bedwall_stud</code> bays is now-or-never</b>: it has to go in before this sheet does. Ordinary shelf loads need none of it."
- tag: LOCKED
  text: "<b>Rev AS closes four items.</b> <b>Header-to-king straps: scrapped.</b> (<b>Rev BA.1:</b> Drawing 7 was still drawing the strap markers and telling the builder to fit them, eight revs after this decision — removed. And Rev AZ took the loft face of that sheathing from ¾ to ½, which moves the premise of the sentence below; <b>the builder has accepted it without a calculation</b>, on the grounds that the joint carries gravity into the trimmers, whose bearing is checked, so the sheathing here is a racking and continuity gusset rather than a tension tie. Recorded so it is not reopened by accident.)  The half wall is sheathed on BOTH faces across the header-to-king joint (<code>hw_sheath_stair</code> z 24→58 and <code>hw_sheath_loft_head</code> z {m:hw_sheath_loft_head.z0}→{m:hw_sheath_loft_head.z1} both lap the header at z 41½–50¾ and run onto both kings at y 0–1½ and 48½–50), and two continuous top plates bear over the header and both kings. Nailed to header and kings, that is a stiffer tie than a strap — so nail the sheathing to both, and the strap is genuinely redundant. <b>Slat-to-plate joint: specified</b> — adhesive + one #8 × 2½ angled into the plate per slat, 16ga pins for assembly only. This screen is the guard for the bed, so the top is a structural joint, not trim. <b>Screen top-plate position: 47¼→50¾</b>, decided — attic access means blocking can be added wherever it lands. <b>Right-wall and bed-wall ledger fixings: ¼ × 4 and ⅜ × 4</b>, sized off 1½ of ledger + ⅝ of board. <b>Rev AU adds the deck-ply front-edge blocking</b> — nine 2×4 blocks on edge at the beam face (eight at 10½, one 5¾ at the rim), one 8 ft board. It closes the last gap in the diaphragm: the joists hang off the beam, so the deck had no fastening to it at all."
- tag: VERIFY
  text: "Lay out and cut one stringer, measure the actual throat and plumb cut, then cut the other two. <b>Do not step 8¼ off seven times</b> — that lands at 57¾, ¼ short of the deck; the seventh riser is 8½."
- tag: LOCKED
  text: "Deck {deck} · platform {m:beam_wrap_face.size.x} × {m:beam_wrap_face.y1} · 8 × {ledge_h} boxed ledge · {bay} bay · single {beam_stock} upstand beam wrapped on face, bed side and top · post-free · half-wall at the stair end · full-height slat screen · 6 @ 8¼ to the landing + 8½ landing→deck / 9 run · 27 landing at 49½ (27⅞ finished) · {tread_t} ply treads over {riser_t} risers, riser in front of the plumb cut and the tread butted to its face · stringers 9 under the landing, notched over the kicker · landing box all 2×8 · nook ply-wrapped x 102¾→131 behind a two-piece face, head raked with the stringers, flat ceiling {nook_fin_h} flush with the landing-ledger bottoms · stair carriage on the half-wall framing at 106¼, finished treads still 24 behind a skirt · header full 9¼ stock."
