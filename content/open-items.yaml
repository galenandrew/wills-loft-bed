# Open items (site/open-items.html). tag: PARKED · FIELD · SPECIFY · SEQUENCE · VERIFY · LOCKED. text is HTML.
items:
- tag: FIELD
  text: "<b>Studs</b> in the bed wall, window wall and right wall — every ledger and stringer C depend on them. <b>Ceiling joist</b> nearest 50¾ out. <b>Mattress</b> thickness — MEASURED 2026-09-06, 8 mattress + 2 topper = 10; sitting headroom is 28, not 32. <b>Room depth</b> — the chain now closes on 186 only because the door's <b>4 to the corner is assumed, not measured</b> (it was 3½, which left ½ unplaced). Confirm both: door casing to the closet-wall corner, and the room's overall depth. Nothing built depends on it — the ½ lands in the stair-to-dresser gap either way. <b>Floor joists</b> under the half-wall plate and the kicker."
- tag: SPECIFY
  text: "<b>How the beam's face wrap is made</b> — at 14¾ × 107 it is no longer a 1×12 rip: a glued-up panel, two boards with a horizontal seam, or ¾ paint-grade ply with solid edges. It is the most-seen face on the bed and it is painted, so ply with a filled vertical butt joint is the recommendation — decide before ordering. · Deck-ply front-edge blocking at the beam · header-to-king straps (member) · kicker anchorage · bottom-plate anchorage (still two boards, y 0→3½ and 46½→50, but each now runs the full 28¼ from the half wall through the nook) · slat-to-plate joint · screen top-plate position (47¼→50¾ vs 46½→50 + band)."
- tag: SEQUENCE
  text: "Nook power into the half-wall before sheathing; switch on the half-wall face, desk side. <b>The nook lining goes in before the nook face</b> — the face laps the ends of all three lining sheets, so a face panel fitted first has to come off again. <b>The stair-side skirt goes on last</b> (Rev AE): it lands on top of the landing box and the stringers, so it cannot be fitted until they are, and the treads and risers butt it. <b>Both bottom plates run through the half wall into the nook</b> — set them out and fix them as one board each, before the jamb packs. Stringer B's screws go in before the landing deck. Risers go on before the treads — each tread butts the face of the riser behind it."
- tag: VERIFY
  text: "Lay out and cut one stringer, measure the actual throat and plumb cut, then cut the other two. <b>Do not step 8¼ off seven times</b> — that lands at 57¾, ¼ short of the deck; the seventh riser is 8½."
- tag: LOCKED
  text: "Deck 58 · platform 107 × 50¾ · 8 × {ledge_h} boxed ledge · {bay} bay · single 1¾ × 14 LVL upstand beam wrapped on face, bed side and top · post-free · half-wall at the stair end · full-height slat screen · 6 @ 8¼ to the landing + 8½ landing→deck / 9 run · 27 landing at 49½ (27⅞ finished) · ¾ ply treads over ¾ risers, riser in front of the plumb cut and the tread butted to its face · stringers 9 under the landing, notched over the kicker · landing box all 2×8 · nook ply-wrapped x 102¾→131 behind a two-piece face, head raked with the stringers, flat ceiling 40¾ flush with the landing-ledger bottoms · stair carriage on the half-wall framing at 106¼, finished treads still 24 behind a skirt · header full 9¼ stock."
