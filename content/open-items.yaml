- tag: PARKED
  text: "<b>Beam left end.</b> Side ledger stops at 48; beam is 47→50 — 1 of 3 backed. Fix: ledger to 50¾ + LUS210-2/HUS210-2 (also gives slat 0 a seat). Builder's call."
- tag: FIELD
  text: "<b>Studs</b> in the bed wall, window wall and right wall — every ledger and stringer C depend on them. <b>Ceiling joist</b> nearest 50¾ out. <b>Mattress</b> thickness (6 assumed). <b>Room depth</b> — ½ unplaced in the chain. <b>Floor joists</b> under the half-wall plate and the kicker."
- tag: SPECIFY
  text: "Beam lamination · deck-ply front-edge blocking at the beam · header-to-king straps (member) · kicker anchorage · half-wall bottom-plate anchorage (two pieces now, y 0→3 and 47→50) · nook nailer-wall sill anchorage · slat-to-beam and slat-to-plate joints · screen top-plate position (47¼→50¾ vs 46½→50 + band)."
- tag: SEQUENCE
  text: "Nook power into the half-wall before sheathing; switch on the half-wall face, desk side. Stringer B's screws go in before the landing deck. Risers go on before the treads — each tread butts the face of the riser behind it."
- tag: PARKED
  text: "<b>Header depth.</b> Rev X raised the header bottom to 41.71 (the landing-ledger bottom) with its top still pinned at 50.75 by the plates, so the 2×10 sandwich is <b>ripped to 9.04</b>. The stock-depth fix is a <b>59½ deck / 8.500 riser</b> — the only value at which deck → riser → landing → ledger → header (full 9¼) → two plates → deck rim closes exactly. Deferred to the loft-platform port; it moves the deck 1½ and steepens the riser."
- tag: VERIFY
  text: "Lay out and cut one stringer, measure the actual throat and plumb cut, then cut the other two."
- tag: LOCKED
  text: "Deck 58 · platform 107 × 50¾ · 8 boxed ledge · 39 bay · doubled 2×10 upstand beam with ¾ wrap · post-free · half-wall at the stair end · full-height slat screen · 7 @ 8.286 / 9 run · 27 landing at 49.71 (27⅞ finished) · ¾ ply treads over ¾ risers, riser in front of the plumb cut and the tread butted to its face · stringers 9 under the landing, notched over the kicker · landing box all 2×8 · nook ply-wrapped x 102→131, head raked with the stringers, flat ceiling 40.96 flush with the landing-ledger bottoms."
