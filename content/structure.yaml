# Structure & load path table. Placeholders are filled from drawings.model.VALS at build time and an unknown
# name fails the build: {throat} is a named value, {m:rear_ledger.size.x} / {m:beam.z0} read any member extent
# straight off the model. Quote the model this way for every DIMENSION. What is left literal is deliberate:
# nominal stock and hardware names, stated design constants (the tread nose, the minimum throat),
# historical parentheticals, and the hand-computed load figures (psi, lb, psf, deflection) — nothing in the
# model derives those, so re-check them by hand whenever a member they depend on moves.
rows:
- member: "Front beam"
  spec: "Single {m:beam.size.y} × {m:beam.size.z} LVL, {beam_span} c/c bearings ({beam_clear_span} clear), notched {m:beam_tongue.size.x} × {beam_notch_depth} at the window end"
  check: "~370 psi vs ~2600 allowable · deflection ≈ L/7000 · depth is set by the mattress, not by load · notch shear ≈1,960 lb vs ≈600 · d/b = {beam_db}, and the slat screen at {slat_oc} centres holds its top edge in line"
- member: "Joists"
  spec: "2×4 @ {joist_oc} o.c., {deck_joist_span} span, LUS24 both ends"
  check: "~372 psi · joists hang from the beam's face, they do not bear on it · joist 0 is the exception: it is one {joist0_len} board running {m:deck_joist_tail.size.y} past the beam face and is sistered to the side ledger, and the beam bears on IT"
- member: "Deck"
  spec: "¾ ply, glued + screwed"
  check: "Required — the diaphragm in place of posts · front-edge blocking at the beam to add"
- member: "Rear ledger"
  spec: "2×4, {m:rear_ledger.size.x}, {m:rear_ledger.z0}→{m:rear_ledger.z1} — at deck level, matching the side ledger"
  check: "~110 lb per stud · lags into every stud · deck ply runs over it to the bed wall"
- member: "Side ledger"
  spec: "2×4, {m:side_ledger.y1} out, {m:side_ledger.z0}→{m:side_ledger.z1} — at deck level, not up to the beam top"
  check: "The beam's notched end BEARS on it and on joist 0 sistered to it — {m:beam_tongue.size.x} × {m:beam.size.y} = {beam_seat_area} sq in, ~115 psi vs 425 · the deck ply runs over it to the wall and is what stops it rolling under the eccentric load · FIELD: a stud within 6 of y {m:side_ledger.y1}, or blocking added"
- member: "Half-wall"
  spec: "{hw_fin_w} finished where it shows — ¾ ply + {m:hw_bottom_plate_a.size.y} studs + ¾ skirt · {hw_stair_fin} where the stair runs against it · two stud packs, no field studs · top plate {m:hw_top_plate_2.z1}"
  check: "Deck and beam end bear on top · portal frame with a sandwich header"
- member: "Half-wall faces"
  spec: "Nook face two boards from 4×8 ¾ ply — {m:hw_sheath_loft_a.size.y} stile + {m:hw_sheath_loft_b.y0} × {m:hw_sheath_loft_b.size.z} board, seam on y {m:hw_sheath_loft_a.size.y} · stair face ONE {m:hw_sheath_stair.size.y} × 44¼ board, cut to the stringers' top line, both end caps included (Rev AE; 44¼ not 42 — Rev AG raised the ledge cap, AH dropped it ¾ under the lid, AI took the lid to {m:ledge_lid.z1})"
  check: "Rev AE · the stair face is a skirt, not sheathing: stringer A and the landing box land on the framing at {m:hw_header.x1} and nothing fastens through ply · seams backed full length · nook face laps the lining, which stops ¾ back at x {m:hw_sheath_loft_a.x1}"
- member: "Nook header"
  spec: "2×10 + ½ ply + 2×10 = {m:hw_header.size.x} wide × {m:hw_header.size.z} full stock, over a {nook_rough_w} × {nook_rough_h} rough opening"
  check: "~700 lb → ~140 psi · sized by connection depth: every landing hanger is fully backed by it · bottom = the landing-ledger bottom, so the nook soffit is one plane"
- member: "Header lamination"
  spec: "16d @ 12 o.c., two rows, through the spacer"
  check: "Hangers on the stair face reach the far ply only through this nailing — Rev AE: no ¾ facing in any path, so 3½ screws reach what 4½ used to"
- member: "Landing box"
  spec: "2×8 rim, side member, both ledgers at {m:lnd_rim.z0}→{m:lnd_rim.z1} · Rev AE: out to x {m:lnd_rim.x0} with stringer A"
  check: "Rim on HUC28s, header side with SD screws into the framing · side member 6 × ¼×4 SDS · 2 × A35 at the corner"
- member: "Landing joists"
  spec: "2 × 2×4 running with the stringers, LUS24s"
  check: "Five support lines under the ¾ deck at ≤ 7"
- member: "Stringers"
  spec: "3 × 2×12, {riser} rise / {run} run, {top_run} top run under the landing"
  check: "Throat {throat} vs 3½ min · plumb cut ≈7 = ≈full rim depth · one 8' board each"
- member: "Stringer fixing"
  spec: "A: 4 SDS into the header + 2 toe-screws, on the framing direct · B: 3 SDS from inside the box · C: on the ledger end + 4 SDS into studs"
  check: "≈170 lb per stringer at the top"
- member: "Treads"
  spec: "¾ ply, 9⅛ on a {run} run (⅛ overhang), tape-sealed edge, painted"
  check: "Stringers dropped ¾ · closed risers, no bullnose"
- member: "Stringer A skin"
  spec: "¾ ply on stringer A's outer face, y {skin_y0}→{skin_y1} — Rev AE: out ¾ with the stringer, and into the notch cut in the wall's end cap"
  check: "Closes the understair cavity from the room · nailed to the stringer + a 2×4 raked cleat that butts the shortwall plate and dies into the stringer underside · treads and risers lap it {board_w_skin}"
- member: "Stringer A skin — cutting"
  spec: "Separate piece: the end cap still returns the full {hw_fin_w} above the stringer at y {skin_y0}→50¾, and 70 × {stair_projection} comes out of no sheet"
  check: "Scribe off the stringer before any board goes on · every stepped edge is covered by ¾ of tread or riser — only the face and the floor line are seen"
- member: "Nook finish"
  spec: "one ¾ ply wrap, x {m:hw_bottom_plate_a.x0}→{room_x} (recessed ¾ behind the face); soffit in TWO ¾ boards (Rev AE) — flat to y {y_meet}, then a raked board butted flush to it on the stringers; head raked"
  check: "Finished {nook_fin_w} × {nook_fin_h} · far end {nook_far_end_height} · wafer LED only (chase {nook_light_chase})"
- member: "Screen"
  spec: "{slat_count} × 2×2 poplar slats @ {slat_clear2} clear, centred on the beam (y {m:slat[0].y0}–{m:slat[0].y1}), 2×4 flat top plate"
  check: "Guard for a {deck} deck: top plate into ceiling framing · slat base joints to specify"
- member: "Whole assembly"
  spec: "≈850 lb loaded"
  check: "~17 psf average — but delivered on two lines (half-wall plate, kicker); floor joists below to be located"
ceiling_note: "<b>Ceiling joists run parallel to the bed wall</b> — the top plate can't cross them. Measure the joist line nearest {m:screen_top_plate.y1} out; the plate spans {m:screen_top_plate.y0}–{m:screen_top_plate.y1} (text) or 46½–50 with a ¾ band (Drawing 3 of Rev T) — <b>decide the plate position first</b>, then measure. If the joist falls outside the band, adjust the ledge (6–10 all work). Don't skip it: unattached, a 200 lb lean at the top of the screen overloads the slat bases."
